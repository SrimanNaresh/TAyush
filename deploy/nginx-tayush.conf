# tayush.thangaminfotech.com -> Ayush ALL IN ONE (Phase 6 cut-over).
# nginx serves the built frontend; /api goes to the PM2 API on port 5160.
# Uses the shared wildcard certificate already on the server.
server {
    listen 80;
    server_name tayush.thangaminfotech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tayush.thangaminfotech.com;

    ssl_certificate     /etc/letsencrypt/live/thangaminfotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thangaminfotech.com/privkey.pem;

    root /opt/projects/ayushallinone/frontend/dist;
    index index.html;
    client_max_body_size 25m;   # patient record uploads (20 MB) and Excel imports

    location /api/ {
        proxy_pass http://127.0.0.1:5160;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;  # large lab / item imports
    }

    # The service worker and index must never be cached, so updates reach users.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
